<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Verity agent workflow</title>
  <desc id="desc">Planner to Retriever to Analyst to Writer to Verifier to Assembler. The verifier uses retained source documents and can send the draft back to the writer while retries remain.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5L1 6" fill="none" stroke="#89938d" stroke-width="1.2"/></marker>
    <marker id="back" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5L1 6" fill="none" stroke="#a16d32" stroke-width="1.2"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1199" height="359" rx="8" fill="#fafbf9" stroke="#e2e6e1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M306 101V46H894V101" fill="none" stroke="#a5ada7" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <rect x="490" y="32" width="220" height="25" fill="#fafbf9"/>
    <text x="600" y="49" text-anchor="middle" fill="#66726a" font-size="14">retained source documents</text>
    <g data-node="planner" transform="translate(32 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Planner</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">identify company</text>
    </g>
    <g data-node="retriever" transform="translate(228 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Retriever</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">filings + XBRL</text>
    </g>
    <g data-node="analyst" transform="translate(424 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Analyst</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">ratios in Python</text>
    </g>
    <g data-node="writer" transform="translate(620 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Writer</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">draft + citations</text>
    </g>
    <g data-node="verifier" transform="translate(816 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Verifier</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">independent check</text>
    </g>
    <g data-node="assembler" transform="translate(1012 104)">
      <rect width="156" height="90" rx="5" fill="#fff" stroke="#c3ccc5"/>
      <text x="78" y="36" text-anchor="middle" fill="#24352b" font-size="20">Assembler</text>
      <text x="78" y="62" text-anchor="middle" fill="#68756d" font-size="13">report + flags</text>
    </g>
    <g fill="none" stroke="#89938d" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M194 149H221"/><path d="M390 149H417"/><path d="M586 149H613"/><path d="M782 149H809"/><path d="M978 149H1005"/>
    </g>
    <path d="M894 201V234H698V201" fill="none" stroke="#a16d32" stroke-width="1.4" marker-end="url(#back)"/>
    <text x="796" y="258" text-anchor="middle" fill="#8d622f" font-size="14">revise while retries remain</text>
    <path d="M32 286H1168" stroke="#e2e6e1"/>
    <text id="status" x="32" y="318" fill="#345943" font-family="Consolas, monospace" font-size="17">Each node passes its output to the next stage.</text>
    <text x="32" y="343" fill="#859087" font-size="12">Workflow illustration</text>
  </g>
</svg>
