<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Verity: financial research with an evidence trail</title>
  <desc id="desc">A stock ticker leads to source documents, financial calculations, cited writing, and evidence checks. The result shows source-aligned claims and claims requiring review. This is an architecture illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#132b36"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#5c8091" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="500" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="120" r="300" fill="url(#glow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(56 48)">
      <rect width="44" height="44" rx="13" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/>
      <path d="M12 22L20 30L33 15" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="32" fill="#f0f6ff" font-size="33" font-weight="700" letter-spacing="3">VERITY</text>
      <text y="90" fill="#5eead4" font-size="13" font-weight="600" letter-spacing="2">FINANCIAL RESEARCH / EVIDENCE VERIFICATION</text>
      <text y="155" fill="#f5f8ff" font-size="48" font-weight="700">Research with</text>
      <text y="212" fill="#f5f8ff" font-size="48" font-weight="700">an evidence trail.</text>
      <text y="255" fill="#b0c3d6" font-size="19">From company filings to cited statements</text>
      <text y="284" fill="#b0c3d6" font-size="19">and visible uncertainty.</text>
    </g>
    <g transform="translate(714 56)">
      <rect width="506" height="132" rx="18" fill="#162838" stroke="#365065"/>
      <rect x="22" y="24" width="38" height="44" rx="6" fill="#213e4a"/>
      <path d="M32 36H50M32 44H50M32 52H44" stroke="#71c9c1" stroke-width="2"/>
      <text x="78" y="40" fill="#8da8bc" font-size="12" font-weight="600" letter-spacing="1.5">SOURCE DOCUMENT</text>
      <text x="78" y="69" fill="#edf4ff" font-size="21" font-weight="600">Revenue was $120 million.</text>
      <text x="24" y="108" fill="#91a9bb" font-size="14">Named source + retrieved passage + evidence identifier</text>
      <path d="M253 145V166" stroke="#5c8091" stroke-width="2" marker-end="url(#arrow)"/>
      <rect y="186" width="506" height="136" rx="18" fill="#112c30" stroke="#2d6966"/>
      <circle cx="36" cy="219" r="11" fill="#5eead4" fill-opacity=".15"/>
      <path d="M30 219L34 223L42 215" fill="none" stroke="#5eead4" stroke-width="2"/>
      <text x="58" y="225" fill="#a4f4e2" font-size="17" font-weight="600">Source-aligned statements</text>
      <circle cx="36" cy="260" r="11" fill="#fbbf24" fill-opacity=".15"/>
      <text x="33" y="265" fill="#fbbf24" font-size="16" font-weight="700">!</text>
      <text x="58" y="266" fill="#fbdc93" font-size="17" font-weight="600">Review flags for uncertain claims</text>
      <text x="24" y="303" fill="#91b2b4" font-size="14">Illustration of the verification process, not a UI screenshot</text>
    </g>
    <path d="M56 400H1220" stroke="#32485a"/>
    <g font-size="16" font-weight="600">
      <text x="58" y="448" fill="#d2e0ee">01  Retrieve sources</text>
      <text x="370" y="448" fill="#d2e0ee">02  Compute and write</text>
      <text x="715" y="448" fill="#d2e0ee">03  Check evidence</text>
      <text x="1050" y="448" fill="#5eead4">04  Review</text>
    </g>
    <path d="M262 443H325M595 443H670M918 443H1005" stroke="#5c8091" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
