<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">Same source, three different verification outcomes</title>
  <desc id="desc">Fictional example: a source says revenue was 120 million dollars and growth is not guaranteed. An identical revenue claim matches the source. A 900 million dollar revenue claim requires review due to a numeric mismatch. A growth guarantee also requires review in rules-only mode.</desc>
  <rect width="1280" height="450" rx="20" fill="#f3f6fa"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="43" fill="#18293d" font-size="24" font-weight="700">Same source. Different claims. Visible outcomes.</text>
    <text x="40" y="70" fill="#59697d" font-size="15">Fictional example · Local rules only · Zero cloud verification calls</text>
    <rect x="40" y="94" width="1200" height="79" rx="12" fill="#e7edf5" stroke="#cdd7e5"/>
    <text x="60" y="120" fill="#52657c" font-size="12" font-weight="700" letter-spacing="1">SOURCE: EXAMPLECO FILING</text>
    <text x="60" y="151" fill="#23354c" font-size="20">Revenue was $120 million. The company does not guarantee growth.</text>
    <g transform="translate(40 200)">
      <rect width="384" height="190" rx="14" fill="#fff" stroke="#c4dfd3"/>
      <rect x="20" y="20" width="140" height="28" rx="14" fill="#e5f5ed"/>
      <text x="34" y="39" fill="#126b47" font-size="12" font-weight="700">SOURCE-ALIGNED</text>
      <text x="20" y="84" fill="#20324a" font-size="20" font-weight="600">Revenue was</text>
      <text x="20" y="112" fill="#20324a" font-size="20" font-weight="600">$120 million.</text>
      <text x="20" y="151" fill="#59697d" font-size="15">Complete sentence matches the source.</text>
      <text x="20" y="174" fill="#59697d" font-size="15">Model inference is skipped.</text>
    </g>
    <g transform="translate(448 200)">
      <rect width="384" height="190" rx="14" fill="#fff" stroke="#e5d6b7"/>
      <rect x="20" y="20" width="123" height="28" rx="14" fill="#fff3d7"/>
      <text x="34" y="39" fill="#8a5700" font-size="12" font-weight="700">NEEDS REVIEW</text>
      <text x="20" y="84" fill="#20324a" font-size="20" font-weight="600">Revenue was</text>
      <text x="20" y="112" fill="#20324a" font-size="20" font-weight="600">$900 million.</text>
      <text x="20" y="151" fill="#59697d" font-size="15">Numeric evidence mismatch.</text>
      <text x="20" y="174" fill="#59697d" font-size="15">Automatic support is blocked.</text>
    </g>
    <g transform="translate(856 200)">
      <rect width="384" height="190" rx="14" fill="#fff" stroke="#e5d6b7"/>
      <rect x="20" y="20" width="123" height="28" rx="14" fill="#fff3d7"/>
      <text x="34" y="39" fill="#8a5700" font-size="12" font-weight="700">NEEDS REVIEW</text>
      <text x="20" y="84" fill="#20324a" font-size="20" font-weight="600">The company</text>
      <text x="20" y="112" fill="#20324a" font-size="20" font-weight="600">guarantees growth.</text>
      <text x="20" y="151" fill="#59697d" font-size="15">Meaning differs from the source.</text>
      <text x="20" y="174" fill="#59697d" font-size="15">Rules alone leave it unverified.</text>
    </g>
    <text x="40" y="426" fill="#65758a" font-size="14">A source match shows alignment with the document. It does not establish that the document is correct.</text>
  </g>
</svg>
